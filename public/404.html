<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LexDICOM — Redirecting</title>
    <script>
      // Automatically redirect lowercase or trailing slash variants to the canonical /LexDICOM/ URL
      var p = window.location.pathname;
      if (p.toLowerCase().indexOf('/lexdicom') !== -1) {
        var rest = p.replace(/^\/[Ll]ex[Dd][Ii][Cc][Oo][Mm]\/?/, '');
        var target = '/LexDICOM/' + (rest ? rest : '') + window.location.search + window.location.hash;
        window.location.replace(target);
      }
    </script>
    <meta http-equiv="refresh" content="0; url=/LexDICOM/" />
  </head>
  <body style="background:#0b0e14;color:#94a3b8;font-family:sans-serif;padding:40px;text-align:center;">
    <p>Loading LexDICOM...</p>
    <p><a href="/LexDICOM/" style="color:#38bdf8;">Click here if not redirected automatically.</a></p>
  </body>
</html>
